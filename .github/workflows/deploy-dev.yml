name: Deploy fluvi-dev (Cloudflare Pages)

# Publica o frontend de DESENVOLVIMENTO e garante o bucket R2 privado de backups.
# Requer o segredo CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID (aceito como variável ou segredo).
# A URL e a chave anon do Supabase são públicas por definição (vão no bundle);
# nenhuma chave service_role é usada aqui.

on:
  workflow_dispatch:
  push:
    branches: [marco-a/fundacao, main]
    paths: ["apps/web/**", ".github/workflows/deploy-dev.yml"]

permissions:
  contents: read

concurrency:
  group: deploy-fluvi-dev
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Credenciais presentes
        run: |
          [ -n "$CLOUDFLARE_API_TOKEN" ] || { echo "::error::falta o segredo CLOUDFLARE_API_TOKEN"; exit 1; }
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || { echo "::error::falta CLOUDFLARE_ACCOUNT_ID (variável ou segredo)"; exit 1; }
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Build (aponta para o Supabase fluvi-dev)
        env:
          VITE_SUPABASE_URL: https://wovocbnnpvsxndwjghco.supabase.co
          # chave anon (role=anon): pública por definição, vai no bundle; RLS protege os dados
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Indvdm9jYm5ucHZzeG5kd2pnaGNvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIwNzEzNTgsImV4cCI6MjEwNzY0NzM1OH0.sTJKxbyeh6tjU4PkbAsvWJOv66pDwburNqkvCmiWDKU
        run: pnpm web:build

      - name: Projeto Pages e bucket R2 (idempotente)
        run: |
          pnpm exec wrangler pages project create fluvi-dev --production-branch main 2>&1 | tail -2 || true
          pnpm exec wrangler r2 bucket create fluvi-backups-dev 2>&1 | tail -2 || true
          pnpm exec wrangler r2 bucket lifecycle add fluvi-backups-dev expira-35-dias --expire-days 35 --force 2>&1 | tail -2 || true

      - name: Publicar
        run: pnpm exec wrangler pages deploy apps/web/dist --project-name fluvi-dev --branch main --commit-dirty=true
